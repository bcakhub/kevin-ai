<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ghost AI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #00ffff;
    font-family: 'Courier New', Courier, monospace;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* HEADER */
  #header {
    padding: 10px 16px;
    border-bottom: 1px solid #00ffff33;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    min-height: 48px;
  }
  #header h1 {
    font-size: 1.1rem;
    color: #00ffff;
    letter-spacing: 4px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  #header h1 span {
    display: inline-block;
    width: 10px;
    height: 1.1rem;
    background: #00ffff;
    margin-left: 4px;
    animation: blink 1s step-end infinite;
    vertical-align: middle;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  #header-links { display: flex; gap: 12px; flex-shrink: 0; }
  #header-links a {
    color: #00ffff88;
    text-decoration: none;
    font-size: 0.75rem;
    letter-spacing: 1px;
    padding: 4px 6px;
    white-space: nowrap;
  }
  #header-links a:hover { color: #00ffff; }

  /* CHAT AREA */
  #chat-container {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    -webkit-overflow-scrolling: touch;
  }
  #chat-container::-webkit-scrollbar { width: 4px; }
  #chat-container::-webkit-scrollbar-thumb { background: #00ffff44; border-radius: 2px; }

  /* MESSAGES */
  .message {
    max-width: 88%;
    line-height: 1.6;
    font-size: 0.88rem;
    word-break: break-word;
    overflow-wrap: anywhere;
  }
  .message.user {
    align-self: flex-end;
    color: #00ffff;
    border-left: 2px solid #00ffff;
    padding-left: 10px;
    white-space: pre-wrap;
  }
  .message.assistant {
    align-self: flex-start;
    color: #aaffff;
    border-left: 2px solid #00ffff44;
    padding-left: 10px;
  }
  .message.system-msg {
    align-self: center;
    color: #00ffff44;
    font-size: 0.75rem;
    letter-spacing: 2px;
  }

  /* TOOL INDICATOR */
  .tool-indicator {
    align-self: flex-start;
    color: #00ffff66;
    font-size: 0.75rem;
    letter-spacing: 2px;
    padding-left: 12px;
    border-left: 2px solid #00ffff22;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }

  /* CODE BLOCKS */
  .code-block-wrapper {
    position: relative;
    margin: 8px 0;
    border: 1px solid #00ffff33;
    border-radius: 4px;
    overflow: hidden;
    max-width: 100%;
  }
  .lang-label {
    background: #00ffff11;
    color: #00ffff88;
    font-size: 0.7rem;
    padding: 3px 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .copy-btn {
    position: absolute;
    top: 4px;
    right: 8px;
    background: transparent;
    border: 1px solid #00ffff44;
    color: #00ffff88;
    font-size: 0.7rem;
    padding: 3px 10px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 1px;
    touch-action: manipulation;
    min-height: 28px;
  }
  .copy-btn:hover, .copy-btn:active { color: #00ffff; border-color: #00ffff; }
  .code-block-wrapper pre {
    margin: 0;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .code-block-wrapper code { font-size: 0.8rem; white-space: pre; }

  /* FILE INDICATOR */
  #file-indicator {
    color: #00ffff66;
    font-size: 0.75rem;
    padding: 4px 16px;
    display: none;
    flex-shrink: 0;
  }

  /* INPUT AREA */
  #input-area {
    border-top: 1px solid #00ffff33;
    padding: 10px 12px;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    flex-shrink: 0;
    background: #000;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
  }
  #prompt-symbol {
    color: #00ffff;
    font-size: 1rem;
    flex-shrink: 0;
    padding-bottom: 6px;
  }
  #message-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #00ffff;
    font-family: inherit;
    font-size: 0.9rem;
    resize: none;
    height: 36px;
    max-height: 120px;
    overflow-y: auto;
    -webkit-appearance: none;
    line-height: 1.5;
  }
  #message-input::placeholder { color: #00ffff44; }
  #btn-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  #file-btn {
    background: transparent;
    border: 1px solid #00ffff33;
    color: #00ffff88;
    padding: 0;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.75rem;
    letter-spacing: 1px;
    touch-action: manipulation;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  #file-btn:hover, #file-btn:active { border-color: #00ffff; color: #00ffff; }
  #send-btn {
    background: transparent;
    border: 1px solid #00ffff;
    color: #00ffff;
    padding: 0 14px;
    height: 36px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.82rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    touch-action: manipulation;
    flex-shrink: 0;
    white-space: nowrap;
  }
  #send-btn:hover, #send-btn:active { background: #00ffff; color: #000; }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #file-input { display: none; }

  /* IMAGES */
  img.ai-image {
    max-width: min(300px, 100%);
    border: 1px solid #00ffff33;
    margin-top: 8px;
    display: block;
  }

  /* MOBILE OVERRIDES */
  @media (max-width: 600px) {
    body { height: 100dvh; }
    #header { padding: 8px 12px; min-height: 44px; }
    #header h1 { font-size: 0.95rem; letter-spacing: 2px; }
    #header-links a { font-size: 0.7rem; padding: 4px 4px; }
    #chat-container { padding: 12px 10px; gap: 12px; }
    .message { max-width: 96%; font-size: 0.85rem; }
    #input-area { padding: 8px 10px; padding-bottom: max(8px, env(safe-area-inset-bottom)); gap: 6px; }
    #message-input { font-size: 16px; /* prevents iOS zoom on focus */ }
    #send-btn { padding: 0 12px; font-size: 0.78rem; letter-spacing: 1px; }
    .code-block-wrapper code { font-size: 0.75rem; }
    .copy-btn { font-size: 0.65rem; padding: 2px 8px; }
  }

  @media (max-width: 380px) {
    #header h1 { font-size: 0.85rem; letter-spacing: 1px; }
    #header-links a { font-size: 0.65rem; }
    #file-btn { width: 32px; height: 32px; font-size: 0.7rem; }
    #send-btn { height: 32px; padding: 0 10px; }
  }
</style>
</head>
<body>
<div id="header">
  <h1>GHOST<span></span></h1>
  <div id="header-links">
    <a href="/memory">memory</a>
    <a href="/logout">logout</a>
  </div>
</div>
<div id="chat-container"></div>
<div id="file-indicator"></div>
<div id="input-area">
  <span id="prompt-symbol">&gt;</span>
  <textarea id="message-input" placeholder="type a message..." rows="1"></textarea>
  <div id="btn-group">
    <button id="file-btn" title="Attach file" onclick="document.getElementById('file-input').click()">+</button>
    <input type="file" id="file-input" accept=".lua,.py,.js,.html,.txt,.json">
    <button id="send-btn">send</button>
  </div>
</div>
<audio id="notify-sound" src="https://www.soundjay.com/buttons/sounds/button-09.mp3" preload="auto"></audio>
<script>
var chatContainer = document.getElementById("chat-container");
var input = document.getElementById("message-input");
var sendBtn = document.getElementById("send-btn");
var fileInput = document.getElementById("file-input");
var fileIndicator = document.getElementById("file-indicator");
var attachedFile = null;

var TOOL_LABELS = {
  "web_search": "> searching the web...",
  "read_webpage": "> reading webpage...",
  "read_github_file": "> reading github file...",
  "generate_image": "> generating image...",
  "read_memory_bin": "> reading memory..."
};

// Load history on page load
window.addEventListener("load", function() {
  fetch("/history")
    .then(function(r) { return r.json(); })
    .then(function(history) {
      // Clear container first
      chatContainer.innerHTML = "";
      if (!history || history.length === 0) {
        addSystemMsg("GHOST ONLINE -- READY");
        return;
      }
      // Render each message
      for (var i = 0; i < history.length; i++) {
        var msg = history[i];
        if (msg.role === "user" || msg.role === "assistant") {
          appendMessage(msg.role, msg.content, false);
        }
      }
      scrollToBottom();
    })
    .catch(function() {
      chatContainer.innerHTML = "";
      addSystemMsg("GHOST ONLINE -- READY");
    });
});

function addSystemMsg(text) {
  var div = document.createElement("div");
  div.className = "message system-msg";
  div.textContent = text;
  chatContainer.appendChild(div);
  scrollToBottom();
}

fileInput.onchange = function() {
  if (fileInput.files.length > 0) {
    attachedFile = fileInput.files[0];
    fileIndicator.textContent = "attached: " + attachedFile.name;
    fileIndicator.style.display = "block";
  }
};

input.addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

input.addEventListener("input", function() {
  input.style.height = "36px";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
});

sendBtn.addEventListener("click", function() {
  sendMessage();
});

function scrollToBottom() {
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

function escapeHtml(text) {
  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function formatMessage(text) {
  var result = "";
  var codeRegex = /```(\w+)?\n?([\s\S]*?)```/g;
  var lastIndex = 0;
  var match;
  codeRegex.lastIndex = 0;
  while ((match = codeRegex.exec(text)) !== null) {
    var before = text.slice(lastIndex, match.index);
    if (before) result += formatPlain(before);
    var lang = match[1] || "plaintext";
    var code = match[2];
    var highlighted;
    try { highlighted = hljs.highlight(code, {language: lang, ignoreIllegals: true}).value; }
    catch(e) { highlighted = escapeHtml(code); }
    result += '<div class="code-block-wrapper">' +
      '<div class="lang-label">' + lang + '</div>' +
      '<button class="copy-btn" onclick="copyCode(this)">copy</button>' +
      '<pre><code class="hljs language-' + lang + '">' + highlighted + '</code></pre>' +
      '</div>';
    lastIndex = match.index + match[0].length;
  }
  var rest = text.slice(lastIndex);
  if (rest) result += formatPlain(rest);
  return result;
}

function formatPlain(text) {
  text = escapeHtml(text);
  text = text.replace(/IMAGE_URL:(https:\/\/[^\s&]+)/g, '<img class="ai-image" src="$1" alt="Generated image">');
  text = text.replace(/\n/g, "<br>");
  return text;
}

function copyCode(btn) {
  var code = btn.parentElement.querySelector("code").innerText;
  navigator.clipboard.writeText(code).then(function() {
    btn.textContent = "copied";
    setTimeout(function() { btn.textContent = "copy"; }, 2000);
  }).catch(function() {
    // Fallback for older mobile browsers
    var ta = document.createElement("textarea");
    ta.value = code;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); btn.textContent = "copied"; setTimeout(function(){ btn.textContent = "copy"; }, 2000); } catch(e) {}
    document.body.removeChild(ta);
  });
}

function appendMessage(role, content, animate) {
  var div = document.createElement("div");
  div.className = "message " + role;
  if (!animate) {
    div.innerHTML = formatMessage(content);
  }
  chatContainer.appendChild(div);
  scrollToBottom();
  return div;
}

function showToolIndicator(toolName) {
  removeToolIndicator();
  var label = TOOL_LABELS[toolName] || ("> " + toolName + "...");
  var div = document.createElement("div");
  div.id = "tool-indicator";
  div.className = "tool-indicator";
  div.textContent = label;
  chatContainer.appendChild(div);
  scrollToBottom();
}

function removeToolIndicator() {
  var el = document.getElementById("tool-indicator");
  if (el) el.parentNode.removeChild(el);
}

function removeThinking() {
  var el = document.getElementById("thinking-indicator");
  if (el) el.parentNode.removeChild(el);
}

function sendMessage() {
  var text = input.value.trim();
  if (!text && !attachedFile) return;
  if (sendBtn.disabled) return;

  input.value = "";
  input.style.height = "36px";
  sendBtn.disabled = true;

  appendMessage("user", text, false);

  var formData = new FormData();
  formData.append("message", text);
  if (attachedFile) {
    formData.append("file", attachedFile);
    attachedFile = null;
    fileIndicator.style.display = "none";
    fileInput.value = "";
  }

  var thinkingDiv = document.createElement("div");
  thinkingDiv.className = "tool-indicator";
  thinkingDiv.id = "thinking-indicator";
  thinkingDiv.textContent = "> ghost is thinking...";
  chatContainer.appendChild(thinkingDiv);
  scrollToBottom();

  var msgDiv = appendMessage("assistant", "", true);
  var fullText = "";
  var thinkingRemoved = false;

  fetch("/chat", { method: "POST", body: formData })
    .then(function(response) {
      var reader = response.body.getReader();
      var decoder = new TextDecoder();
      var buffer = "";

      function read() {
        reader.read().then(function(result) {
          if (result.done) {
            removeThinking();
            removeToolIndicator();
            // Clean up empty assistant bubble if nothing came through
            if (!fullText.trim()) {
              msgDiv.parentNode && msgDiv.parentNode.removeChild(msgDiv);
            }
            sendBtn.disabled = false;
            input.focus();
            return;
          }

          buffer += decoder.decode(result.value, { stream: true });
          var lines = buffer.split("\n");
          buffer = lines.pop();

          for (var i = 0; i < lines.length; i++) {
            var line = lines[i];
            if (line.indexOf("data: ") === 0) {
              try {
                var data = JSON.parse(line.slice(6));

                if (data.tool_use) {
                  showToolIndicator(data.tool_use);
                }

                if (data.token) {
                  if (!thinkingRemoved) {
                    removeThinking();
                    removeToolIndicator();
                    thinkingRemoved = true;
                  }
                  fullText += data.token;
                  msgDiv.innerHTML = formatMessage(fullText);
                  scrollToBottom();
                }

                if (data.done) {
                  removeToolIndicator();
                  try { document.getElementById("notify-sound").play(); } catch(e) {}
                }
              } catch(e) {}
            }
          }

          read();
        }).catch(function(e) {
          removeThinking();
          removeToolIndicator();
          if (msgDiv.parentNode) msgDiv.innerHTML = "Connection error: " + e.message;
          sendBtn.disabled = false;
          input.focus();
        });
      }

      read();
    })
    .catch(function(e) {
      removeThinking();
      removeToolIndicator();
      if (msgDiv.parentNode) msgDiv.innerHTML = "Connection error: " + e.message;
      sendBtn.disabled = false;
      input.focus();
    });
}
</script>
</body>
</html>
