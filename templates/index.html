<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghost AI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; color: #00ffff; font-family: 'Courier New', Courier, monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  #header { padding: 12px 20px; border-bottom: 1px solid #00ffff33; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  #header h1 { font-size: 1.2rem; color: #00ffff; letter-spacing: 4px; text-transform: uppercase; }
  #header h1 span { display: inline-block; width: 10px; height: 1.2rem; background: #00ffff; margin-left: 4px; animation: blink 1s step-end infinite; vertical-align: middle; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  #header-links a { color: #00ffff88; text-decoration: none; font-size: 0.75rem; margin-left: 16px; letter-spacing: 1px; }
  #header-links a:hover { color: #00ffff; }
  #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  #chat-container::-webkit-scrollbar { width: 4px; }
  #chat-container::-webkit-scrollbar-track { background: #000; }
  #chat-container::-webkit-scrollbar-thumb { background: #00ffff44; border-radius: 2px; }
  .message { max-width: 85%; line-height: 1.6; font-size: 0.9rem; word-break: break-word; }
  .message.user { align-self: flex-end; color: #00ffff; border-left: 2px solid #00ffff; padding-left: 10px; white-space: pre-wrap; }
  .message.assistant { align-self: flex-start; color: #aaffff; border-left: 2px solid #00ffff44; padding-left: 10px; }
  .message.system-msg { align-self: center; color: #00ffff44; font-size: 0.75rem; letter-spacing: 2px; }
  .tool-indicator { align-self: flex-start; color: #00ffff66; font-size: 0.75rem; letter-spacing: 2px; padding-left: 12px; border-left: 2px solid #00ffff22; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }
  .code-block-wrapper { position: relative; margin: 8px 0; border: 1px solid #00ffff33; border-radius: 4px; overflow: hidden; }
  .code-block-wrapper .lang-label { background: #00ffff11; color: #00ffff88; font-size: 0.7rem; padding: 3px 10px; letter-spacing: 2px; text-transform: uppercase; }
  .code-block-wrapper .copy-btn { position: absolute; top: 4px; right: 8px; background: transparent; border: 1px solid #00ffff44; color: #00ffff88; font-size: 0.7rem; padding: 2px 8px; cursor: pointer; font-family: inherit; letter-spacing: 1px; }
  .code-block-wrapper .copy-btn:hover { color: #00ffff; border-color: #00ffff; }
  .code-block-wrapper pre { margin: 0; }
  .code-block-wrapper code { font-size: 0.82rem; }
  #input-area { border-top: 1px solid #00ffff33; padding: 12px 20px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; background: #000; }
  #prompt-symbol { color: #00ffff; font-size: 1rem; flex-shrink: 0; }
  #message-input { flex: 1; background: transparent; border: none; outline: none; color: #00ffff; font-family: inherit; font-size: 0.9rem; resize: none; height: 36px; max-height: 120px; overflow-y: auto; }
  #message-input::placeholder { color: #00ffff44; }
  #file-btn { background: transparent; border: 1px solid #00ffff33; color: #00ffff88; padding: 4px 10px; cursor: pointer; font-family: inherit; font-size: 0.75rem; letter-spacing: 1px; }
  #file-btn:hover { border-color: #00ffff; color: #00ffff; }
  #send-btn { background: transparent; border: 1px solid #00ffff; color: #00ffff; padding: 6px 16px; cursor: pointer; font-family: inherit; font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase; }
  #send-btn:hover { background: #00ffff; color: #000; }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #file-input { display: none; }
  #file-indicator { color: #00ffff66; font-size: 0.75rem; padding: 0 20px 8px; display: none; }
  img.ai-image { max-width: 300px; border: 1px solid #00ffff33; margin-top: 8px; display: block; }
  @media (max-width: 600px) { .message { max-width: 98%; } #header h1 { font-size: 1rem; } }
</style>
</head>
<body>
<div id="header">
  <h1>GHOST<span></span></h1>
  <div id="header-links">
    <a href="/memory">memory</a>
    <a href="/logout">logout</a>
  </div>
</div>
<div id="chat-container">
  <div class="message system-msg">GHOST ONLINE -- READY</div>
</div>
<div id="file-indicator"></div>
<div id="input-area">
  <span id="prompt-symbol">&gt;</span>
  <textarea id="message-input" placeholder="type a message..." rows="1"></textarea>
  <button id="file-btn" onclick="document.getElementById('file-input').click()">attach</button>
  <input type="file" id="file-input" accept=".lua,.py,.js,.html,.txt,.json">
  <button id="send-btn" onclick="sendMessage()">send</button>
</div>
<audio id="notify-sound" src="https://www.soundjay.com/buttons/sounds/button-09.mp3" preload="auto"></audio>
<script>
const chatContainer = document.getElementById("chat-container");
const input = document.getElementById("message-input");
const sendBtn = document.getElementById("send-btn");
const fileInput = document.getElementById("file-input");
const fileIndicator = document.getElementById("file-indicator");
let attachedFile = null;

const TOOL_LABELS = {
  "web_search": "searching the web...",
  "read_webpage": "reading webpage...",
  "read_github_file": "reading github file...",
  "generate_image": "generating image...",
  "read_memory_bin": "reading memory..."
};

window.addEventListener("load", async () => {
  try {
    const res = await fetch("/history");
    const history = await res.json();
    history.forEach(msg => {
      if (msg.role === "user" || msg.role === "assistant") {
        appendMessage(msg.role, msg.content, false);
      }
    });
    scrollToBottom();
  } catch(e) {}
});

fileInput.addEventListener("change", () => {
  if (fileInput.files.length > 0) {
    attachedFile = fileInput.files[0];
    fileIndicator.textContent = "attached: " + attachedFile.name;
    fileIndicator.style.display = "block";
  }
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

input.addEventListener("input", () => {
  input.style.height = "36px";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
});

function scrollToBottom() { chatContainer.scrollTop = chatContainer.scrollHeight; }

function escapeHtml(text) {
  return text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function formatMessage(text) {
  const codeBlockRegex = /```(\w+)?
?([\s\S]*?)```/g;
  let html = "";
  let lastIndex = 0;
  let match;
  while ((match = codeBlockRegex.exec(text)) !== null) {
    const before = text.slice(lastIndex, match.index);
    if (before) html += formatInline(before);
    const lang = match[1] || "plaintext";
    const code = match[2];
    let highlighted;
    try { highlighted = hljs.highlight(code, {language: lang, ignoreIllegals: true}).value; }
    catch(e) { highlighted = escapeHtml(code); }
    html += `<div class="code-block-wrapper">
      <div class="lang-label">${lang}</div>
      <button class="copy-btn" onclick="copyCode(this)">copy</button>
      <pre><code class="hljs language-${lang}">${highlighted}</code></pre>
    </div>`;
    lastIndex = match.index + match[0].length;
  }
  const rest = text.slice(lastIndex);
  if (rest) html += formatInline(rest);
  return html;
}

function formatInline(text) {
  // Handle image URLs from generate_image tool
  text = text.replace(/IMAGE_URL:(https:\/\/[^\s]+)/g, '<img class="ai-image" src="$1" alt="Generated image">');
  return escapeHtml(text).replace(/\n/g, "<br>");
}

function copyCode(btn) {
  const code = btn.parentElement.querySelector("code").innerText;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = "copied";
    setTimeout(() => btn.textContent = "copy", 2000);
  });
}

function appendMessage(role, content, animate) {
  const div = document.createElement("div");
  div.className = `message ${role}`;
  if (animate) {
    div.innerHTML = "";
    chatContainer.appendChild(div);
    scrollToBottom();
    return div;
  } else {
    div.innerHTML = formatMessage(content);
    chatContainer.appendChild(div);
    scrollToBottom();
    return div;
  }
}

function showToolIndicator(toolName) {
  // Remove any existing tool indicator
  const existing = document.getElementById("tool-indicator");
  if (existing) existing.remove();
  const label = TOOL_LABELS[toolName] || (toolName + "...");
  const div = document.createElement("div");
  div.id = "tool-indicator";
  div.className = "tool-indicator";
  div.textContent = "> " + label;
  chatContainer.appendChild(div);
  scrollToBottom();
}

function removeToolIndicator() {
  const existing = document.getElementById("tool-indicator");
  if (existing) existing.remove();
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text && !attachedFile) return;
  if (sendBtn.disabled) return;

  input.value = "";
  input.style.height = "36px";
  sendBtn.disabled = true;

  appendMessage("user", text, false);

  const formData = new FormData();
  formData.append("message", text);
  if (attachedFile) {
    formData.append("file", attachedFile);
    attachedFile = null;
    fileIndicator.style.display = "none";
    fileInput.value = "";
  }

  // Thinking indicator
  const thinkingDiv = document.createElement("div");
  thinkingDiv.className = "tool-indicator";
  thinkingDiv.id = "thinking-indicator";
  thinkingDiv.textContent = "> ghost is thinking...";
  chatContainer.appendChild(thinkingDiv);
  scrollToBottom();

  const msgDiv = appendMessage("assistant", "", true);
  let fullText = "";

  try {
    const response = await fetch("/chat", { method: "POST", body: formData });
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let thinkingRemoved = false;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (line.startsWith("data: ")) {
          try {
            const data = JSON.parse(line.slice(6));

            if (data.tool_use) {
              showToolIndicator(data.tool_use);
            }

            if (data.token) {
              if (!thinkingRemoved) {
                const th = document.getElementById("thinking-indicator");
                if (th) th.remove();
                removeToolIndicator();
                thinkingRemoved = true;
              }
              fullText += data.token;
              msgDiv.innerHTML = formatMessage(fullText);
              scrollToBottom();
            }

            if (data.done) {
              removeToolIndicator();
              try { document.getElementById("notify-sound").play(); } catch(e) {}
            }
          } catch(e) {}
        }
      }
    }
  } catch(e) {
    const th = document.getElementById("thinking-indicator");
    if (th) th.remove();
    removeToolIndicator();
    msgDiv.innerHTML = "Error: " + e.message;
  }

  sendBtn.disabled = false;
  input.focus();
}
</script>
</body>
</html>
