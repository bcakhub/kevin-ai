<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghost AI - Login</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #00ffff;
    font-family: 'Courier New', Courier, monospace;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-box {
    border: 1px solid #00ffff33;
    padding: 40px;
    width: 340px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .login-box h1 {
    font-size: 1.4rem;
    letter-spacing: 6px;
    text-transform: uppercase;
    text-align: center;
  }
  .login-box h1 span {
    display: inline-block;
    width: 10px;
    height: 1.2rem;
    background: #00ffff;
    margin-left: 2px;
    animation: blink 1s step-end infinite;
    vertical-align: middle;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  .subtitle {
    text-align: center;
    color: #00ffff44;
    font-size: 0.75rem;
    letter-spacing: 2px;
  }
  input[type="password"] {
    background: transparent;
    border: 1px solid #00ffff44;
    color: #00ffff;
    font-family: inherit;
    font-size: 0.9rem;
    padding: 10px 14px;
    outline: none;
    width: 100%;
  }
  input[type="password"]:focus { border-color: #00ffff; }
  input[type="password"]::placeholder { color: #00ffff33; }
  button {
    background: transparent;
    border: 1px solid #00ffff;
    color: #00ffff;
    font-family: inherit;
    font-size: 0.85rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 10px;
    cursor: pointer;
    width: 100%;
  }
  button:hover { background: #00ffff; color: #000; }
  .error {
    color: #ff4444;
    font-size: 0.8rem;
    text-align: center;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="login-box">
  <h1>GHOST<span></span></h1>
  <div class="subtitle">personal ai assistant</div>
  <form method="POST" action="/login">
    <div style="display:flex;flex-direction:column;gap:12px;">
      <input type="password" name="password" placeholder="enter password" autofocus>
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
      <button type="submit">access</button>
    </div>
  </form>
</div>
</body>
</html>
